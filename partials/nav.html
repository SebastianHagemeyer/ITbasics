  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img class="logo-mark" src="/logo-binary.svg" alt="" width="32" height="32" />
        <span>Hallam IT Basics</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/"{{home}}>Home</a>
        <div class="nav-dropdown" data-open="false">
          <button type="button" class="nav-dropdown-toggle{{learn}}" aria-haspopup="true" aria-expanded="false">
            Learn
            <svg class="nav-chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="nav-dropdown-menu" role="menu">
            <a href="/modules/" role="menuitem">All modules</a>
            <a href="/docs/" role="menuitem">Documentation</a>
            <a href="/assignments/"{{assignments}} role="menuitem">Assignments</a>
          </div>
        </div>
        <div class="nav-dropdown" data-open="false">
          <button type="button" class="nav-dropdown-toggle{{play}}" aria-haspopup="true" aria-expanded="false">
            Play
            <svg class="nav-chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="nav-dropdown-menu" role="menu">
            <a href="/sandbox/" role="menuitem">Sandbox</a>
            <a href="/challenges/" role="menuitem">Live Coding</a>
            <a href="/freeplay/" role="menuitem">Freeplay</a>
            <a href="/leaderboard/" role="menuitem">Leaderboard</a>
          </div>
        </div>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle"
              title="Switch between light and dark" aria-pressed="false">
        <span class="theme-toggle-label">Dark</span>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.6" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6"/>
            <path d="M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9"/>
          </g>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.2 14.2A8.4 8.4 0 0 1 9.8 3.8a8.6 8.6 0 1 0 10.4 10.4z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>
