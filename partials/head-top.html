  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Decide the theme before the page paints, or a dark-mode student gets a
    // white flash on every single navigation. This has to be inline and it has
    // to be here: app.js loads at the end of <body>, which is far too late.
    // It is also the only place prefers-color-scheme is read, so the stylesheet
    // needs just one dark block instead of two that can drift apart.
    (function () {
      try {
        var saved = localStorage.getItem("itbasics-theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.dataset.theme = "dark";
      } catch (e) {
        /* Private browsing can throw on localStorage. Light is a fine default. */
      }
    })();
  </script>
  <!-- Only drives the header button. Deferred, because the theme itself is
       already settled by the script above. -->
  <script src="/theme.js" defer></script>
