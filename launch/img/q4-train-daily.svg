<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="An alarm clock between a sunrise and a moonlit evening, above a week of ticked training days">
  <defs>
    <style>
      .o { stroke: #2d2346; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #2d2346; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
      .day { font-family: 'Arial Rounded MT Bold','Trebuchet MS',Verdana,sans-serif; font-size: 15px; font-weight: 900; fill: #ffffff; text-anchor: middle; letter-spacing: 1px; }
      .tag { font-family: 'Arial Rounded MT Bold','Trebuchet MS',Verdana,sans-serif; font-size: 17px; font-weight: 900; letter-spacing: 2px; }
    </style>
    <linearGradient id="morning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc98a"/>
      <stop offset="1" stop-color="#fff1d6"/>
    </linearGradient>
    <linearGradient id="evening" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3290"/>
      <stop offset="1" stop-color="#9182ff"/>
    </linearGradient>
    <mask id="moonMask">
      <rect width="600" height="400" fill="#ffffff"/>
      <circle cx="522" cy="74" r="28" fill="#000000"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="300" height="400" fill="url(#morning)"/>
  <rect x="300" y="0" width="300" height="400" fill="url(#evening)"/>

  <!-- morning: rising sun + hills -->
  <g stroke="#ffb020" stroke-width="6" stroke-linecap="round">
    <line x1="90" y1="186" x2="90" y2="156"/>
    <line x1="40" y1="206" x2="20" y2="186"/>
    <line x1="140" y1="206" x2="160" y2="186"/>
  </g>
  <circle cx="90" cy="250" r="56" fill="#ffd23f" class="o"/>
  <path d="M0 250 Q70 214 150 246 T300 240 V290 H0 Z" fill="#7bdc6a" class="o"/>
  <text class="tag" x="22" y="40" fill="#8a4b12">BEFORE SCHOOL</text>

  <!-- evening: moon + stars -->
  <circle cx="508" cy="82" r="30" fill="#fff3b0" class="o" mask="url(#moonMask)"/>
  <g fill="#ffffff">
    <circle cx="420" cy="140" r="3"/><circle cx="560" cy="160" r="2.5"/><circle cx="460" cy="60" r="2"/><circle cx="380" cy="90" r="2.5"/><circle cx="570" cy="230" r="2"/>
  </g>
  <path d="M300 252 Q380 226 460 248 T600 236 V290 H300 Z" fill="#4c3fa3" class="o"/>
  <text class="tag" x="578" y="40" fill="#ffffff" text-anchor="end">AFTER SCHOOL</text>

  <!-- alarm clock -->
  <ellipse cx="300" cy="262" rx="78" ry="10" fill="#2d2346" opacity="0.18"/>
  <line x1="252" y1="226" x2="238" y2="256" class="o"/>
  <line x1="348" y1="226" x2="362" y2="256" class="o"/>
  <g transform="rotate(-24 246 86)"><path d="M216 98 a30 30 0 0 1 60 0 Z" fill="#ffc93c" class="o"/></g>
  <g transform="rotate(24 354 86)"><path d="M324 98 a30 30 0 0 1 60 0 Z" fill="#ffc93c" class="o"/></g>
  <line x1="300" y1="76" x2="300" y2="62" class="o"/>
  <circle cx="300" cy="58" r="8" fill="#ffc93c" class="thin"/>
  <circle cx="300" cy="158" r="82" fill="#ff5d73" class="o"/>
  <circle cx="300" cy="158" r="64" fill="#ffffff" class="o"/>
  <g stroke="#2d2346" stroke-width="4" stroke-linecap="round">
    <line x1="300" y1="100" x2="300" y2="110"/><line x1="300" y1="206" x2="300" y2="216"/>
    <line x1="242" y1="158" x2="252" y2="158"/><line x1="348" y1="158" x2="358" y2="158"/>
  </g>
  <g fill="#2d2346">
    <circle cx="329" cy="108" r="2.5"/><circle cx="350" cy="129" r="2.5"/><circle cx="350" cy="187" r="2.5"/><circle cx="329" cy="208" r="2.5"/>
    <circle cx="271" cy="208" r="2.5"/><circle cx="250" cy="187" r="2.5"/><circle cx="250" cy="129" r="2.5"/><circle cx="271" cy="108" r="2.5"/>
  </g>
  <line x1="300" y1="158" x2="283" y2="187" stroke="#2d2346" stroke-width="7" stroke-linecap="round"/>
  <line x1="300" y1="158" x2="300" y2="112" stroke="#2d2346" stroke-width="5" stroke-linecap="round"/>
  <circle cx="300" cy="158" r="6" fill="#ff5d73" class="thin"/>
  <rect x="246" y="116" width="10" height="44" rx="5" fill="#ff5d73" opacity="0.15"/>
  <!-- ring lines -->
  <g stroke="#2d2346" stroke-width="4" stroke-linecap="round">
    <line x1="196" y1="98" x2="180" y2="88"/><line x1="192" y1="122" x2="174" y2="120"/>
    <line x1="404" y1="98" x2="420" y2="88"/><line x1="408" y1="122" x2="426" y2="120"/>
  </g>

  <!-- the week, every day ticked -->
  <g>
    <rect x="62" y="296" width="84" height="74" rx="12" fill="#ffffff" class="o"/>
    <rect x="160" y="296" width="84" height="74" rx="12" fill="#ffffff" class="o"/>
    <rect x="258" y="296" width="84" height="74" rx="12" fill="#ffffff" class="o"/>
    <rect x="356" y="296" width="84" height="74" rx="12" fill="#ffffff" class="o"/>
    <rect x="454" y="296" width="84" height="74" rx="12" fill="#ffffff" class="o"/>
    <path d="M62 320 V308 a12 12 0 0 1 12 -12 h60 a12 12 0 0 1 12 12 V320 Z" fill="#4f7cff" class="o"/>
    <path d="M160 320 V308 a12 12 0 0 1 12 -12 h60 a12 12 0 0 1 12 12 V320 Z" fill="#ff7a3d" class="o"/>
    <path d="M258 320 V308 a12 12 0 0 1 12 -12 h60 a12 12 0 0 1 12 12 V320 Z" fill="#3cc7b5" class="o"/>
    <path d="M356 320 V308 a12 12 0 0 1 12 -12 h60 a12 12 0 0 1 12 12 V320 Z" fill="#a35cff" class="o"/>
    <path d="M454 320 V308 a12 12 0 0 1 12 -12 h60 a12 12 0 0 1 12 12 V320 Z" fill="#ff5d73" class="o"/>
    <text class="day" x="104" y="314">MON</text>
    <text class="day" x="202" y="314">TUE</text>
    <text class="day" x="300" y="314">WED</text>
    <text class="day" x="398" y="314">THU</text>
    <text class="day" x="496" y="314">FRI</text>
    <g fill="none" stroke="#1f9d55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M88 344 l11 11 l20 -22"/>
      <path d="M186 344 l11 11 l20 -22"/>
      <path d="M284 344 l11 11 l20 -22"/>
      <path d="M382 344 l11 11 l20 -22"/>
      <path d="M480 344 l11 11 l20 -22"/>
    </g>
  </g>
</svg>
