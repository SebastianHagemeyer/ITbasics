<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="A gold Sports Academy trophy">
  <defs>
    <style>
      .o { stroke: #2d2346; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #2d2346; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8efff"/>
      <stop offset="1" stop-color="#a9dcff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.55" stop-color="#ffc93c"/>
      <stop offset="1" stop-color="#f29a1f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.4">
    <polygon points="300,170 820,170 802,305"/>
    <polygon points="300,170 750,430 668,538"/>
    <polygon points="300,170 560,620 435,672"/>
    <polygon points="300,170 300,690 165,672"/>
    <polygon points="300,170 40,620 -68,538"/>
    <polygon points="300,170 -150,430 -202,305"/>
    <polygon points="300,170 -220,170 -202,35"/>
    <polygon points="300,170 -150,-90 -68,-198"/>
    <polygon points="300,170 40,-280 165,-332"/>
    <polygon points="300,170 300,-350 435,-332"/>
    <polygon points="300,170 560,-280 668,-198"/>
    <polygon points="300,170 750,-90 802,35"/>
  </g>
  <!-- confetti -->
  <g class="thin">
    <rect x="80" y="70" width="18" height="10" rx="3" fill="#ff5d73" transform="rotate(-25 89 75)"/>
    <rect x="140" y="250" width="18" height="10" rx="3" fill="#3cc7b5" transform="rotate(30 149 255)"/>
    <rect x="470" y="60" width="18" height="10" rx="3" fill="#a35cff" transform="rotate(20 479 65)"/>
    <rect x="510" y="240" width="18" height="10" rx="3" fill="#ffc93c" transform="rotate(-35 519 245)"/>
    <circle cx="110" cy="170" r="7" fill="#4f7cff"/>
    <circle cx="490" cy="160" r="7" fill="#ff7a3d"/>
    <circle cx="420" cy="320" r="6" fill="#ff5d73"/>
    <circle cx="170" cy="335" r="6" fill="#a35cff"/>
  </g>
  <g fill="#ffffff" stroke="#2d2346" stroke-width="3" stroke-linejoin="round">
    <path d="M170 92 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 z"/>
    <path d="M430 108 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5 z"/>
  </g>

  <!-- trophy -->
  <ellipse cx="300" cy="352" rx="110" ry="12" fill="#2d2346" opacity="0.16"/>
  <path d="M226 108 C168 104 168 196 238 196" fill="none" stroke="#2d2346" stroke-width="22" stroke-linecap="round"/>
  <path d="M226 108 C168 104 168 196 238 196" fill="none" stroke="#ffc93c" stroke-width="11" stroke-linecap="round"/>
  <path d="M374 108 C432 104 432 196 362 196" fill="none" stroke="#2d2346" stroke-width="22" stroke-linecap="round"/>
  <path d="M374 108 C432 104 432 196 362 196" fill="none" stroke="#f29a1f" stroke-width="11" stroke-linecap="round"/>
  <path d="M218 84 H382 V148 C382 206 346 238 300 238 C254 238 218 206 218 148 Z" fill="url(#gold)" class="o"/>
  <rect x="236" y="98" width="14" height="96" rx="7" fill="#ffffff" opacity="0.5"/>
  <path d="M300 122 l11 22 l24 3 l-17 16 l4 24 l-22 -11 l-22 11 l4 -24 l-17 -16 l24 -3 z" fill="#ff5d73" class="thin"/>
  <rect x="286" y="236" width="28" height="36" fill="url(#gold)" class="o"/>
  <rect x="250" y="268" width="100" height="16" rx="6" fill="url(#gold)" class="o"/>
  <rect x="222" y="282" width="156" height="64" rx="12" fill="#7b6cf6" class="o"/>
  <rect x="242" y="298" width="116" height="32" rx="6" fill="#fff3c4" class="thin"/>

  <!-- Year 10 pennant -->
  <g transform="rotate(-12 470 210)">
    <line x1="430" y1="160" x2="430" y2="300" stroke="#2d2346" stroke-width="6" stroke-linecap="round"/>
    <path d="M433 166 L540 190 L433 222 Z" fill="#ff5d73" class="o"/>
  </g>
</svg>
