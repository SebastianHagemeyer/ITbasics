    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fc"/>
      <stop offset="0.5" stop-color="#c3cbdb"/>
      <stop offset="1" stop-color="#8e98ad"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c99bff"/>
      <stop offset="1" stop-color="#8a3ff0"/>
    </radialGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7b8c"/>
      <stop offset="0.6" stop-color="#ff4d66"/>
      <stop offset="1" stop-color="#d93451"/>
    </linearGradient>
  </defs>

