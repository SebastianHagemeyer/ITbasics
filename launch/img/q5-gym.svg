<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
  <title id="t">Cartoon gym</title>
  <desc id="d">A bright cartoon gym with a bench press, dumbbell rack, punching bag, smiling kettlebells, an exercise ball and a water bottle.</desc>
  <defs>
