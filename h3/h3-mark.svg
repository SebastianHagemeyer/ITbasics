<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The H3 mark: an H built from three glowing tritium tubes (the capsules in
       glow keyrings and exit signs) with a superscript 3, since tritium is
       hydrogen-3. The tile is dark on purpose in both themes, so it glows on
       light and dark pages alike. The 3 is a path, not text, so it looks the
       same everywhere (an SVG used as an image cannot load web fonts). -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0a1a12"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="11.25" fill="none" stroke="#1f4a33" stroke-width="1.5"/>
  <g transform="translate(-1.5 0)">
    <g filter="url(#glow)" fill="#3ff58a">
      <rect x="12" y="14" width="9" height="38" rx="4.5"/>
      <rect x="35" y="14" width="9" height="38" rx="4.5"/>
      <rect x="19" y="29" width="18" height="8" rx="4"/>
    </g>
    <g fill="#d8ffe7">
      <rect x="14.5" y="18" width="4" height="30" rx="2"/>
      <rect x="37.5" y="18" width="4" height="30" rx="2"/>
      <rect x="22" y="31.5" width="12" height="3" rx="1.5"/>
    </g>
    <path d="M48 11.5H55L51.2 16.2C53.8 16.2 55.6 17.9 55.6 20.3C55.6 22.8 53.6 24.6 51 24.6C49.4 24.6 48.1 24 47.3 22.9"
          fill="none" stroke="#3ff58a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>
